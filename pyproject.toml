[project]
name = "web2-projekt-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-types>=0.24.0",
    "gunicorn>=27.0.1",
    "psycopg2-binary>=2.9.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "DTZ", "C4", "SIM", "PERF", "T20", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["w2p2", "w2p2_app"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true
